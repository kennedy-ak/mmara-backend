version: '3.8'

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmara-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mmara:mmara@postgres:5432/mmara
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./data:/app/data
      - ./../Criminal_proceeding:/app/documents/criminal:ro
      - ./../Road_traffic:/app/documents/traffic:ro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - mmara-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mmara-postgres
    environment:
      - POSTGRES_USER=mmara
      - POSTGRES_PASSWORD=mmara
      - POSTGRES_DB=mmara
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - mmara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmara"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mmara-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - mmara-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: mmara-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - mmara-network
    profiles:
      - production

volumes:
  postgres-data:
  redis-data:

networks:
  mmara-network:
    driver: bridge
